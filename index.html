f:`#travaux`,label:`Travaux`},{href:`#questions`,label:`Questions`},{href:`#rencontrer`,label:`Nous rejoindre`}],m=[{number:`01`,title:`Pourquoi Mozart, pourquoi Voltaire ?`,text:`Deux figures choisies comme programme : la beauté qui met en mouvement et la pensée qui libère.`,href:`https://gos-cahiers-bleus.weebly.com/reacutefeacuterences-et-opinions/category/pourquoi-mozart`},{number:`02`,title:`Les Rites Français`,text:`Une tradition initiatique vivante, ouverte à la pluralité des lectures et à la liberté de conscience.`,href:`https://gos-cahiers-bleus.weebly.com/reacutefeacuterences-et-opinions/category/le-rite-franccedilais-au-grand-orient-de-suisse`},{number:`03`,title:`La fraternité, notre seule issue ?`,text:`Une planche ouverte sur le passage du « je » au « nous » et sur la fraternité comme expérience vécue.`,href:`https://gos-cahiers-bleus.weebly.com/reacutefeacuterences-et-opinions/la-fraternite-notre-seule-issue`}],h=[{date:`25.04.2025`,kind:`Planche`,title:`Afrique, mais quelle Afrique ?`,text:`Une invitation à dépasser les images toutes faites pour regarder la pluralité des histoires, des peuples et des trajectoires.`,href:`https://mozartetvoltaire.ch/afrique-mais-quelle-afrique-pub/`},{date:`12.01.2024`,kind:`Réflexion`,title:`Intelligence artificielle : ange ou démon ?`,text:`Une réflexion maçonnique sur les promesses, les vertiges et la responsabilité humaine face à l’intelligence artificielle.`,href:`https://mozartetvoltaire.ch/intelligence-artificielle-ange-ou-demon/`},{date:`21.12.2019`,kind:`Symbolisme`,title:`Pourquoi fêter le solstice d’hiver ?`,text:`La nuit la plus longue comme seuil : le retour de la lumière, la transmission et le recommencement.`,href:`https://mozartetvoltaire.ch/pourquoi-feter-le-solstice-dhiver-pub/`}],g=[{date:`06.11.2025`,title:`Calendrier des travaux`,text:`Les prochains travaux, rencontres et rendez-vous publics de la Loge.`,href:`https://mozartetvoltaire.ch/`},{date:`02.09.2025`,title:`Prix 2025 de l’engagement humaniste`,text:`Une conférence publique consacrée à l’engagement humaniste et à celles et ceux qui le font vivre.`,href:`https://mozartetvoltaire.ch/conference-publique-prix-2025-de-lengagement-humaniste/`},{date:`15.05.2025`,title:`S’engager pour le présent et le futur`,text:`Penser l’action, la transmission et notre responsabilité dans la cité.`,href:`https://mozartetvoltaire.ch/`}],_=[{number:`01`,title:`Une brève histoire de la Loge`,text:`De l’allumage des feux en 1967 à l’engagement dans la maçonnerie libérale suisse.`,href:`https://mozartetvoltaire.ch/publications/une-breve-histoire-de-la-loge-mozart-et-voltaire/`},{number:`02`,title:`Le secret maçonnique`,text:`Ce qui relève de la discrétion, de l’expérience vécue et de la liberté de chacun.`,href:`https://mozartetvoltaire.ch/`},{number:`03`,title:`Les activités d’une Loge`,text:`Tenues, planches, échanges, agapes et progression de l’Apprenti au Maître.`,href:`https://mozartetvoltaire.ch/`},{number:`04`,title:`À tout homme libre et de bonnes mœurs`,text:`Quelques repères pour celles et ceux qui se demandent si cette voie peut être la leur.`,href:`https://mozartetvoltaire.ch/publications/a-tout-homme-libre-et-de-bonnes-moeurs/`}],v=[{question:`Qu’est-ce qui distingue Mozart & Voltaire ?`,answer:`La Loge travaille au Rite Français dans la famille de la Franc-Maçonnerie libérale. Elle pratique une initiation masculine et reçoit, lors de rencontres appropriées, des Frères et des Sœurs d’autres Loges. La liberté absolue de conscience est au cœur de sa démarche.`},{question:`Qu’est-ce que la Franc-Maçonnerie libérale ?`,answer:`Elle ne demande l’adhésion à aucun dogme et laisse à chacun sa liberté philosophique, spirituelle ou religieuse. Le travail commun repose sur la tolérance, l’examen critique et le respect de l’autre.`},{question:`Pourquoi vous appelez-vous Frères ?`,answer:`Parce que la fraternité n’est pas seulement une idée : elle se pratique par l’écoute, la confiance, l’entraide et la reconnaissance de la dignité de chacun.`},{question:`Comment se déroule une Tenue ?`,answer:`La réunion suit un rituel qui organise l’espace, le temps et la parole. Une planche est présentée, puis travaillée collectivement dans un cadre qui permet le désaccord sans affrontement.`},{question:`Pourquoi Mozart et Voltaire ?`,answer:`Mozart évoque l’harmonie, la création et l’émotion partagée. Voltaire incarne l’esprit critique, la tolérance et le combat contre l’obscurantisme. Ensemble, ils donnent une direction à la Loge.`},{question:`Peut-on vous rencontrer avant de décider ?`,answer:`Oui. Une première conversation n’engage à rien. Elle permet de poser librement ses questions, de comprendre le parcours et de vérifier si la démarche correspond réellement à votre recherche.`}];function y({active:e,replayKey:t}){return(0,d.jsxs)(`div`,{className:`emblem-shell`,"data-focus":e,children:[(0,d.jsx)(`div`,{className:`emblem-halo`}),(0,d.jsxs)(`svg`,{className:`emblem`,viewBox:`0 0 720 720`,role:`img`,"aria-label":`Équerre, compas et fil à plomb dessinés par une lumière dorée`,children:[(0,d.jsxs)(`defs`,{children:[(0,d.jsxs)(`radialGradient`,{id:`halo`,cx:`50%`,cy:`48%`,r:`52%`,children:[(0,d.jsx)(`stop`,{offset:`0`,stopColor:`#f1d99b`,stopOpacity:`.24`}),(0,d.jsx)(`stop`,{offset:`.52`,stopColor:`#c59b4f`,stopOpacity:`.07`}),(0,d.jsx)(`stop`,{offset:`1`,stopColor:`#c59b4f`,stopOpacity:`0`})]}),(0,d.jsxs)(`linearGradient`,{id:`brass`,x1:`0`,y1:`0`,x2:`1`,y2:`1`,children:[(0,d.jsx)(`stop`,{offset:`0`,stopColor:`#fff0c4`}),(0,d.jsx)(`stop`,{offset:`.38`,stopColor:`#d7b66c`}),(0,d.jsx)(`stop`,{offset:`1`,stopColor:`#9c6f2d`})]}),(0,d.jsxs)(`filter`,{id:`softGlow`,x:`-70%`,y:`-70%`,width:`240%`,height:`240%`,children:[(0,d.jsx)(`feGaussianBlur`,{stdDeviation:`7`,result:`blur`}),(0,d.jsxs)(`feMerge`,{children:[(0,d.jsx)(`feMergeNode`,{in:`blur`}),(0,d.jsx)(`feMergeNode`,{in:`SourceGraphic`})]})]}),(0,d.jsxs)(`filter`,{id:`pointGlow`,x:`-180%`,y:`-180%`,width:`460%`,height:`460%`,children:[(0,d.jsx)(`fe   <body>
    <div id="root"></div>
    <aside class="mv-advice" id="mv-advice" aria-live="polite">
      <button class="mv-advice-trigger" type="button" id="mv-advice-trigger" aria-expanded="false" aria-controls="mv-advice-panel"><i aria-hidden="true">✦</i><b>Votre regard</b></button>
      <div class="mv-advice-panel" id="mv-advice-panel" role="dialog" aria-labelledby="mv-advice-title" aria-hidden="true">
        <button class="mv-advice-close" type="button" id="mv-advice-close" aria-label="Fermer">×</button>
        <p class="mv-advice-kicker">Une idée pour la Loge ?</p>
        <h2 id="mv-advice-title">Ton avis est précieux,<br>mon Frère.</h2>
        <p class="mv-advice-intro">Un conseil à donner à Fabien, une idée ou une direction ? Dis-nous simplement ce que tu en penses.</p>
        <form id="mv-advice-form">
          <label><span>Ton conseil</span><textarea id="mv-advice-message" placeholder="Ce que je garderais, ce que j’améliorerais…" required></textarea></label>
          <div class="mv-advice-fields">
            <label><span>Prénom ou nom <small>facultatif</small></span><input id="mv-advice-name" autocomplete="name"></label>
            <label><span>E-mail <small>facultatif</small></span><input id="mv-advice-email" type="email" autocomplete="email"></label>
          </div>
          <button class="mv-advice-send" type="submit">Transmettre mon avis <span>→</span></button>
          <small class="mv-advice-note">Ta messagerie s’ouvrira avec le message préparé. Tu gardes la main sur l’envoi.</small>
        </form>
      </div>
    </aside>
    <script>
      (()=>{const dock=document.getElementById('mv-advice'),trigger=document.getElementById('mv-advice-trigger'),panel=document.getElementById('mv-advice-panel'),close=document.getElementById('mv-advice-close'),form=document.getElementById('mv-advice-form');const setOpen=(open)=>{dock.classList.toggle('open',open);trigger.setAttribute('aria-expanded',String(open));panel.setAttribute('aria-hidden',String(!open))};trigger.addEventListener('click',()=>setOpen(!dock.classList.contains('open')));close.addEventListener('click',()=>setOpen(false));document.addEventListener('keydown',event=>{if(event.key==='Escape')setOpen(false)});window.setTimeout(()=>{dock.classList.add('prompted');setOpen(true)},150000);form.addEventListener('submit',event=>{event.preventDefault();const name=document.getElementById('mv-advice-name').value.trim(),email=document.getElementById('mv-advice-email').value.trim(),message=document.getElementById('mv-advice-message').value.trim();const subject=`Avis fraternel sur le site${name?` — ${name}`:''}`;const body=['Mon conseil / mon idée :',message,'',`Nom : ${name||'Non indiqué'}`,`Adresse de réponse : ${email||'Non indiquée'}`,`Page consultée : ${location.href}`].join('\n');location.href=`mailto:contact@mozartetvoltaire.ch?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`})})();
    </script>
